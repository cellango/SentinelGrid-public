# SentinelGrid Detection Catalog (source of truth)
# This catalog aligns with the 100 seeded detections (V052) and maps each to incident_type,
# default playbook, MITRE/NIST metadata, and a query template ref for the drag-and-drop alarm editor.
# Status values: seeded_db, pending_monitor_def, ready, deprecated.

detections:
  # Identity (1–15)
  - id: ID-NEW-ADMIN
    name: New Admin/Privileged Role Granted
    category: identity
    severity: high
    incident_type: identity_privilege_escalation
    default_playbook_key: ACCOUNT-COMPROMISE
    alert_type: identity_privilege_escalation
    mitre_tactics: ["TA0003"]
    mitre_techniques: ["T1098"]
    nist_controls: ["PR.AC", "DE.CM"]
    query_template_ref: identity_role_assignment
    parameters: {roles: ["admin", "realm-admin", "super-admin", "PowerUser", "OrganizationAdmin"], lookback: "10m", threshold: 1}
    owner: identity
    status: seeded_db

