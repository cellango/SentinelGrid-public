    executor_binding_id: email.fetch_message
    executor_type: service_operation
    target_ref: connector:email:fetch_message
    action_type: investigate
    execution_mode: read_only_tooling
    risk_level: investigative
    requires_approval: false
    default_owner_role: L1
    dry_run_supported: true
    reversible: true
    timeout_seconds: 120
    audit_fields:
      - incident_id
      - message_id
    expected_outcome: Collect the original message and metadata for analyst review.
    rollback_expectation: No rollback required.
    success_signal: The source message and headers are attached to the case.
