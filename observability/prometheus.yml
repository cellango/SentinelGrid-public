global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: sentinelgrid-services
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["api_gateway:8000"]
        labels:
          service: api-gateway
      - targets: ["iam_agent:8000"]
        labels:
          service: iam-agent
      - targets: ["model_gateway:8000"]
        labels:
          service: model-gateway
      - targets: ["orchestrator:8000"]
        labels:
          service: orchestrator
      - targets: ["siem_agent:8000"]
        labels:
          service: siem-agent
      - targets: ["ingestion_service:8000"]
        labels:
          service: ingestion-service
      - targets: ["compliance_service:8000"]
        labels:
          service: compliance-service
      - targets: ["reporting_service:8000"]
        labels:
          service: reporting-service

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888", "otel-collector:8889"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: blackbox-ready
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api_gateway:8000/ready
        labels:
          service: api-gateway
      - targets:
          - http://iam_agent:8000/ready
        labels:
          service: iam-agent
      - targets:
          - http://model_gateway:8000/ready
        labels:
          service: model-gateway
      - targets:
          - http://orchestrator:8000/ready
        labels:
          service: orchestrator
      - targets:
          - http://siem_agent:8000/ready
        labels:
          service: siem-agent
      - targets:
          - http://ingestion_service:8000/ready
        labels:
          service: ingestion-service
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api_gateway:8000/health
        labels:
          service: api-gateway
      - targets:
          - http://frontend:3443
        labels:
          service: frontend
      - targets:
          - http://model_gateway:8000/health
        labels:
          service: model-gateway
      - targets:
          - http://iam_agent:8000/health
        labels:
          service: iam-agent
      - targets:
          - http://orchestrator:8000/health
        labels:
          service: orchestrator
      - targets:
          - http://siem_agent:8000/health
        labels:
          service: siem-agent
      - targets:
          - http://ingestion_service:8000/health
        labels:
          service: ingestion-service
      - targets:
          - http://compliance_service:8000/health
        labels:
          service: compliance-service
      - targets:
          - http://reporting_service:8000/health
        labels:
          service: reporting-service
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
