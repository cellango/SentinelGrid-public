# SentinelGrid Nginx Reverse Proxy Configuration
# Provides SSL termination, HTTP to HTTPS redirect, and load balancing for all services

# HTTP to HTTPS redirect for Keycloak
server {
    listen 8080;
    server_name _;
    
    # Health check endpoint (no redirect for health checks)
    location /health {
        proxy_pass http://keycloak:8080;
        access_log off;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# HTTPS termination and proxy for Keycloak
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    
    # SSL certificate configuration
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffer settings
    proxy_buffering off;
    proxy_request_buffering off;
    
    # Forward to Keycloak (internal)
    location / {
        proxy_pass http://keycloak:8080;
    }
}

# Website (Frontend) - HTTP to HTTPS redirect
# Listen on port 3000 (standard HTTP port) and redirect to HTTPS
server {
    listen 3000;
    server_name _;
    
    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host:3443$request_uri;
    }
}

# Website (Frontend) - HTTPS termination
server {
    listen 3443 ssl;
    http2 on;
    server_name _;
    
    # SSL certificate configuration (using same cert as Keycloak for now)
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Resolver for Docker DNS (avoids DNS caching issues)
    # Use Docker's internal DNS resolver (127.0.0.11)
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;
    
    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffer settings
    proxy_buffering off;
    proxy_request_buffering off;
    
    # Forward IAM Agent API requests (auth, payment, onboarding, agents, hardened-images, git-providers, git-scanning, leads, devices) directly to IAM Agent
    # IAM Agent endpoints: /api/v1/auth/*, /api/v1/payment/*, /api/v1/onboarding/*, /api/v1/agents/*, /api/v1/hardened-images/*, /api/v1/git-providers/*, /api/v1/git-scanning/*, /api/v1/leads/*, /api/v1/devices/*
    location ~ ^/api/v1/(auth|payment|onboarding|agents|hardened-images|git-providers|git-scanning|leads|devices) {
        # Use variable to force DNS resolution on each request (avoids caching)
        set $iam_agent "iam_agent:8000";
        proxy_pass http://$iam_agent;
    }
    
    # Forward other API requests to API Gateway
    # API Gateway expects paths like /api/v1/alerts, so we preserve the /api prefix
    location /api {
        # Use variable to force DNS resolution on each request (avoids caching)
        set $api_gateway "api_gateway:8000";
        proxy_pass http://$api_gateway;
    }
    
    # Forward IAM Portal API requests to IAM Agent
    location ~ ^/api/iam-portal {
        set $iam_agent "iam_agent:8000";
        proxy_pass http://$iam_agent;
    }
    
    # Forward IAM Policies API requests to IAM Agent
    location ~ ^/api/iam-policies {
        set $iam_agent "iam_agent:8000";
        proxy_pass http://$iam_agent;
    }
    
    # Forward all requests to Frontend (single Next.js app)
    # Frontend handles both marketing pages (/, /login, /signup) and dashboard (/dashboard/*)
    location / {
        set $frontend_backend "frontend:3000";
        proxy_pass http://$frontend_backend;
    }
}
