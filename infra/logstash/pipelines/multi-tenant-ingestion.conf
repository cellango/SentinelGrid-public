# Logstash Multi-Tenant Ingestion Pipeline
# Ensures all logs include sg.tenant_id and sg.realm for proper isolation

input {
  # Beats input (Filebeat, Winlogbeat, etc.)
  beats {
    port => 5044
    type => "beats"
  }
  
  # Syslog input
  syslog {
    port => 5514
    type => "syslog"
  }
  
  # HTTP input for API ingestion
  http {
    port => 8080
    type => "http"
  }
}

filter {
  # Extract tenant_id from multiple sources (in order of preference)
  
  # 1. From HTTP headers (if sent via API)
  if [headers][x-tenant-id] {
    mutate {
      add_field => {
        "[sg][tenant_id]" => "%{[headers][x-tenant-id]}"
      }
    }
  }
  
  # 2. From HTTP headers (realm)
  if [headers][x-realm] {
    mutate {
      add_field => {
        "[sg][realm]" => "%{[headers][x-realm]}"
      }
    }
  }
  
  # 3. From beat fields (configured in agent)
  if [fields][tenant_id] {
    mutate {
      add_field => {
        "[sg][tenant_id]" => "%{[fields][tenant_id]}"
      }
    }
  }
  
  if [fields][realm] {
    mutate {
      add_field => {
        "[sg][realm]" => "%{[fields][realm]}"
      }
    }
  }
  
  # 4. From environment variable (fallback for testing)
  if ![sg][tenant_id] {
    mutate {
      add_field => {
        "[sg][tenant_id]" => "${TENANT_ID:unknown}"
      }
    }
  }
  
  if ![sg][realm] {
    mutate {
      add_field => {
        "[sg][realm]" => "${KEYCLOAK_REALM:sentinelgrid}"
      }
    }
  }
  
  # Validate tenant_id exists
  if [sg][tenant_id] == "unknown" {
    mutate {
      add_tag => ["_tenant_id_missing"]
    }
    # Drop events without tenant_id in production
    # drop {}
  }
  
  # Parse JSON logs if applicable
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
    }
  }
  
  # Normalize timestamp
  if [parsed][@timestamp] {
    date {
      match => ["[parsed][@timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }
  
  # Add ECS metadata
  mutate {
    add_field => {
      "[ecs][version]" => "8.0.0"
    }
  }
  
  # Route determination based on log type
  if [type] == "auth" or [event][category] == "authentication" {
    mutate {
      add_field => {
        "[@metadata][index_type]" => "auth"
      }
    }
  } else if [type] == "email" or [event][category] == "email" {
    mutate {
      add_field => {
        "[@metadata][index_type]" => "email"
      }
    }
  } else if [type] == "endpoint" or [event][category] == "malware" or [event][category] == "process" {
    mutate {
      add_field => {
        "[@metadata][index_type]" => "endpoint"
      }
    }
  } else if [type] == "cloud" or [event][category] == "posture" {
    mutate {
      add_field => {
        "[@metadata][index_type]" => "cloud-posture"
      }
    }
  } else if [type] == "network" or [event][category] == "network" {
    mutate {
      add_field => {
        "[@metadata][index_type]" => "network"
      }
    }
  } else if [type] == "device" or [event][category] == "device" {
    mutate {
      add_field => {
        "[@metadata][index_type]" => "device"
      }
    }
  } else if [type] == "iam" or [event][category] == "iam" {
    mutate {
      add_field => {
        "[@metadata][index_type]" => "iam-audit"
      }
    }
  } else {
    mutate {
      add_field => {
        "[@metadata][index_type]" => "logs"
      }
    }
  }
}

output {
  # Output to OpenSearch with tenant-scoped index
  opensearch {
    hosts => ["${OPENSEARCH_URL:http://localhost:9200}"]
    user => "${OPENSEARCH_USER:admin}"
    password => "${OPENSEARCH_PASSWORD:admin}"
    ssl => false
    ssl_certificate_verification => false
    
    # Dynamic index based on tenant and type
    index => "sg-%{[sg][tenant_id]}-%{[@metadata][index_type]}-%{+YYYY.MM.dd}"
    
    # Document ID (optional)
    # document_id => "%{[event_id]}"
  }
  
  # Debug output (optional - disable in production)
  if "_tenant_id_missing" in [tags] {
    stdout {
      codec => rubydebug {
        metadata => true
      }
    }
  }
}

