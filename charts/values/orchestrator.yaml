replicaCount: 1

image:
  repository: "REPLACE_ME_ECR_REPO/orchestrator"
  tag: "latest"

service:
  port: 8000
  targetPort: 8000

env:
  - name: ENVIRONMENT
    value: production
  - name: UPSTREAM_TLS_VERIFY
    value: "true"

envFrom:
  - secretRef:
      name: orchestrator-runtime

ingress:
  enabled: false

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics/prometheus
  prometheus.io/port: "8000"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 30

networkPolicy:
  enabled: true
  ingress:
    allowNamespaces:
      - sg-ops
    allowServiceInstances:
      - instance: api-gateway
      - instance: siem-agent
  egress:
    allowDNS: true
    allowAnyPorts:
      - port: 5432
        protocol: TCP
    allowServiceInstances:
      - instance: siem-agent
        ports:
          - port: 8000
            protocol: TCP
      - instance: iam-agent
        ports:
          - port: 8000
            protocol: TCP
      - instance: model-gateway
        ports:
          - port: 8000
            protocol: TCP
      - instance: detection-service
        ports:
          - port: 8000
            protocol: TCP
      - instance: framework-service
        ports:
          - port: 8000
            protocol: TCP
      - instance: email-ingestion-service
        ports:
          - port: 8000
            protocol: TCP
      - instance: soar-agent
        ports:
          - port: 8000
            protocol: TCP
      - instance: automated-response-service
        ports:
          - port: 8000
            protocol: TCP
      - instance: compliance-service
        ports:
          - port: 8000
            protocol: TCP
      - instance: scanner-orchestrator
        ports:
          - port: 8000
            protocol: TCP
      - instance: ingestion-service
        ports:
          - port: 8000
            protocol: TCP
