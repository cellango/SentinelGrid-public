replicaCount: 1
image:
  repository: "REPLACE_ME_ECR_REPO/frontend"
  tag: "latest"

service:
  port: 3443
  targetPort: 3443

ingress:
  enabled: true
  className: alb
  annotations: {}
  alb:
    scheme: internet-facing
    listenPorts: '[{"HTTPS":443}]'
    certificateArn: ""
    requireCertificate: true
    backendProtocol: HTTPS
    healthcheckPath: /
    healthcheckProtocol: HTTPS
    healthcheckPort: traffic-port
  hosts:
    - host: app.dev.sentinelgrid.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 750m
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp

livenessProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTPS
  initialDelaySeconds: 30
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTPS
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /
    port: http
    scheme: HTTPS
  periodSeconds: 10
  failureThreshold: 30

networkPolicy:
  enabled: true
  ingress:
    public: true
    allowNamespaces:
      - sg-ops
    ports:
      - port: 3443
        protocol: TCP
  egress:
    allowDNS: true
    allowServiceInstances:
      - instance: api-gateway
        ports:
          - port: 8000
            protocol: TCP
      - instance: iam-agent
        ports:
          - port: 8000
            protocol: TCP
      - instance: connector-service
        ports:
          - port: 8000
            protocol: TCP
      - instance: detection-service
        ports:
          - port: 8000
            protocol: TCP
