replicaCount: 1
image:
  repository: "REPLACE_ME_ECR_REPO/siem_agent"
  tag: "latest"

service:
  port: 8000
  targetPort: 8000

env:
  - name: ENVIRONMENT
    value: production
  - name: UPSTREAM_TLS_VERIFY
    value: "true"
  - name: OPENSEARCH_USE_SSL
    value: "true"
  - name: OPENSEARCH_VERIFY_CERTS
    value: "true"

envFrom:
  - secretRef:
      name: siem-agent-runtime

ingress:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 750m
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics/prometheus
  prometheus.io/port: "8000"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 36

networkPolicy:
  enabled: true
  ingress:
    allowNamespaces:
      - sg-ops
    allowServiceInstances:
      - instance: api-gateway
      - instance: orchestrator
      - instance: detection-service
      - instance: ingestion-service
  egress:
    allowDNS: true
    allowAnyPorts:
      - port: 5432
        protocol: TCP
      - port: 6379
        protocol: TCP
      - port: 8080
        protocol: TCP
      - port: 8085
        protocol: TCP
      - port: 9200
        protocol: TCP
    allowServiceInstances:
      - instance: iam-agent
        ports:
          - port: 8000
            protocol: TCP
      - instance: soar-agent
        ports:
          - port: 8000
            protocol: TCP

keda:
  enabled: true
  minReplicas: 0
  maxReplicas: 2
  triggers: []
