replicaCount: 1

image:
  repository: "REPLACE_ME_ECR_REPO/iam_agent"
  tag: "latest"

service:
  port: 8000
  targetPort: 8000

env:
  - name: ENVIRONMENT
    value: production
  - name: KEYCLOAK_ADMIN_USE_SERVICE_ACCOUNT
    value: "true"
  - name: KEYCLOAK_VERIFY_TLS
    value: "true"
  - name: VAULT_VERIFY_TLS
    value: "true"
  - name: UPSTREAM_TLS_VERIFY
    value: "true"
  - name: PAYMENT_DEV_MODE
    value: "false"

envFrom:
  - secretRef:
      name: iam-agent-runtime

ingress:
  enabled: true
  className: alb
  annotations: {}
  alb:
    scheme: internet-facing
    listenPorts: '[{"HTTPS":443}]'
    certificateArn: ""
    requireCertificate: true
    backendProtocol: HTTP
    healthcheckPath: /health
    healthcheckProtocol: HTTP
    healthcheckPort: traffic-port
  hosts:
    - host: auth.dev.sentinelgrid.local
      paths:
        - path: /auth
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics/prometheus
  prometheus.io/port: "8000"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 36

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true
  ingress:
    public: true
    allowNamespaces:
      - sg-ops
  egress:
    allowDNS: true
    allowAnyPorts:
      - port: 443
        protocol: TCP
      - port: 5432
        protocol: TCP
      - port: 6379
        protocol: TCP
      - port: 8080
        protocol: TCP
      - port: 8200
        protocol: TCP
      - port: 8443
        protocol: TCP
    allowServiceInstances:
      - instance: model-gateway
        ports:
          - port: 8000
            protocol: TCP
      - instance: soar-agent
        ports:
          - port: 8000
            protocol: TCP
      - instance: workflow-engine
        ports:
          - port: 8000
            protocol: TCP
      - instance: cert-service
        ports:
          - port: 8000
            protocol: TCP
