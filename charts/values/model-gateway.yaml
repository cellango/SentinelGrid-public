replicaCount: 1
image:
  repository: "REPLACE_ME_ECR_REPO/model_gateway"
  tag: "latest"

service:
  port: 8000
  targetPort: 8000

env:
  - name: ENVIRONMENT
    value: production
  - name: LLM_RUNTIME
    value: transformers

envFrom:
  - secretRef:
      name: model-gateway-runtime

ingress:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

volumes:
  - name: tmp
    emptyDir: {}
  - name: models
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: models
    mountPath: /models

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics/prometheus
  prometheus.io/port: "8000"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 36

keda:
  enabled: true
  minReplicas: 0
  maxReplicas: 3
  triggers: []

networkPolicy:
  enabled: true
  ingress:
    allowNamespaces:
      - sg-ops
    allowServiceInstances:
      - instance: api-gateway
      - instance: orchestrator
      - instance: iam-agent
      - instance: ingestion-service
  egress:
    allowDNS: true
    allowAnyPorts:
      - port: 443
        protocol: TCP
      - port: 5432
        protocol: TCP
      - port: 6379
        protocol: TCP
    allowServiceInstances:
      - instance: audit-service
        ports:
          - port: 8000
            protocol: TCP
