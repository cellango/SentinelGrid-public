{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "common-service.fullname" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "common-service.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    {{- $metrics := list }}
    {{- if .Values.hpa.targetCPUUtilizationPercentage }}
    {{- $metrics = append $metrics (dict "type" "Resource" "resource" (dict "name" "cpu" "target" (dict "type" "Utilization" "averageUtilization" .Values.hpa.targetCPUUtilizationPercentage))) }}
    {{- end }}
    {{- if .Values.hpa.targetMemoryUtilizationPercentage }}
    {{- $metrics = append $metrics (dict "type" "Resource" "resource" (dict "name" "memory" "target" (dict "type" "Utilization" "averageUtilization" .Values.hpa.targetMemoryUtilizationPercentage))) }}
    {{- end }}
    {{- toYaml $metrics | nindent 2 }}
{{- end }}
