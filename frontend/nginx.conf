# Simplified Nginx configuration for Frontend
# Handles SSL termination and proxies to Next.js
# This file is included in /etc/nginx/conf.d/ (server blocks only)

map $http_cookie $access_token_cookie {
    default "";
    "~*access_token=([^;]+)" $1;
}

map $access_token_cookie $cookie_authorization_header {
    default "";
    ~.+ "Bearer $access_token_cookie";
}

map $http_authorization $resolved_authorization_header {
    default $http_authorization;
    "" $cookie_authorization_header;
}

# HTTPS termination and proxy to Next.js
server {
    listen 3443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    # Resolve Docker service names dynamically so upstream IP changes (container restarts)
    # don't leave us with stale DNS results.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_gateway_host api_gateway;
    set $iam_agent_host iam_agent;
    set $connector_service_host connector_service;
    set $detection_service_host detection_service;
    
    # SSL certificate configuration
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
    # Dev: disable caching at the edge
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # Ensure cookies are passed through
    proxy_pass_header Set-Cookie;
    proxy_cookie_path / /;
    proxy_cookie_domain off;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffer settings
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Access-Control-Expose-Headers;

    # Let the local Next.js API route handle report proxying before the general API catchall
    location = /api/reports-proxy {
        proxy_pass http://localhost:3001/api/reports-proxy;
    }

    # Auth endpoints are served by Next.js (cookie handling, etc.)
    location ^~ /api/auth/ {
        proxy_pass http://localhost:3001/api/auth/;
    }

    # Same-origin IAM chat path for dashboard pages that previously called localhost directly.
    location ^~ /internal/iam/chat {
        proxy_pass http://$iam_agent_host:8000;
        proxy_set_header Authorization $resolved_authorization_header;
    }

    # Public IAM routes still needed by browser flows outside the auth BFF.
    location = /api/v1/auth/signup {
        proxy_pass http://$iam_agent_host:8000;
        proxy_set_header Authorization $resolved_authorization_header;
    }

    location = /api/v1/auth/reset-password-direct {
        proxy_pass http://$iam_agent_host:8000;
        proxy_set_header Authorization $resolved_authorization_header;
    }

    # Browser-side product flows should stay same-origin even when the owning
    # service sits outside the API gateway.
    location ^~ /api/v1/leads/ {
        proxy_pass http://$iam_agent_host:8000;
        proxy_set_header Authorization $resolved_authorization_header;
    }

    location ^~ /api/v1/payment/ {
        proxy_pass http://$iam_agent_host:8000;
        proxy_set_header Authorization $resolved_authorization_header;
    }

    location ^~ /api/v1/marketing/ {
        proxy_pass http://$iam_agent_host:8000;
        proxy_set_header Authorization $resolved_authorization_header;
    }

    location ^~ /api/v1/connectors/ {
        proxy_pass http://$connector_service_host:8000;
        proxy_set_header Authorization $resolved_authorization_header;
    }

    location ^~ /api/v1/rules/ {
        proxy_pass http://$detection_service_host:8000;
        proxy_set_header Authorization $resolved_authorization_header;
    }

    # Ensure orchestrator routes always hit API Gateway (avoid Next.js handling)
    location ^~ /api/orchestrator/ {
        # Preserve full path; do not strip segments
        proxy_pass http://$api_gateway_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /api/v1/orchestrator/ {
        proxy_pass http://$api_gateway_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Authorization $resolved_authorization_header;
    }

    # Directly proxy API requests to API Gateway to avoid browser-facing redirects/mixed content
    location /api/ {
        # Proxy all API calls directly to the API Gateway, preserving the full /api/... path
        proxy_pass http://$api_gateway_host:8000;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Authorization $resolved_authorization_header;
    }

    # Proxy all requests to Next.js (running on internal port 3001)
    location / {
        proxy_pass http://localhost:3001;
    }
}
