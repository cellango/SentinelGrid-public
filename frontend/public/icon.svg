<svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Background transparent so it works on dark sites -->
  <!-- Shield icon -->
  <g transform="translate(10,10)">
    <path
      d="M30 0 L54 8 V30 C54 44 43 57 30 62 C17 57 6 44 6 30 V8 Z"
      fill="none"
      stroke="#22d3ee"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <!-- Vertical grid lines -->
    <line x1="18" y1="8" x2="18" y2="34" stroke="#22d3ee" stroke-width="1.4" opacity="0.65"/>
    <line x1="30" y1="8" x2="30" y2="36" stroke="#22d3ee" stroke-width="1.4" opacity="0.65"/>
    <line x1="42" y1="8" x2="42" y2="34" stroke="#22d3ee" stroke-width="1.4" opacity="0.65"/>
    <!-- Horizontal grid lines -->
    <line x1="12" y1="16" x2="48" y2="16" stroke="#22d3ee" stroke-width="1.4" opacity="0.65"/>
    <line x1="12" y1="24" x2="48" y2="24" stroke="#22d3ee" stroke-width="1.4" opacity="0.65"/>
    <line x1="14" y1="32" x2="46" y2="32" stroke="#22d3ee" stroke-width="1.2" opacity="0.65"/>
  </g>

  <!-- Wordmark -->
  <text x="90" y="34"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
        font-size="26"
        fill="#e5e7eb"
        font-weight="600">
    Sentinel<tspan fill="#22d3ee">Grid</tspan>
  </text>
  <text x="90" y="52"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
        font-size="11"
        fill="#9ca3af"
        letter-spacing="2">
    SECURITY AS A SERVICE
  </text>
</svg>

