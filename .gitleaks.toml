title = "SentinelGrid source preview"

[extend]
useDefault = true

# Narrow exceptions: repository maintainers; reviewed 2026-10-15; recheck by 2026-12-31.
# No path-only ignores, history baselines, credential exceptions, or disabled default rules.

[[allowlists]]
description = "fixed synthetic scanner/auth test inputs"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ["(^|/)SentinelGridAIShield/examples/curl/04\\-guardrails\\.sh$"]
regexTarget = "secret"
regexes = ["^sk\\-1234567890abcdefghij$"]

