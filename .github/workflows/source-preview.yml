name: Source Preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install source-review test dependencies
        run: python -m pip install -r scripts/requirements-preview.txt
      - name: Source hygiene, documentation links/classes, compilation, inventory, and IAM/MCP/gateway/workload identity tests
        run: make preview-check PYTHON=python
      - name: Validate active workflow syntax with actionlint 1.7.12
        shell: bash
        run: |
          review_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$review_dir"
          cd "$review_dir"
          curl --fail --location --retry 3 --output actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$review_dir/actionlint" .github/workflows/source-preview.yml

  iam-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install PostgreSQL server tools for the disposable cluster
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-16 postgresql-contrib
          /usr/lib/postgresql/16/bin/postgres --version
      - run: python -m pip install -r scripts/requirements-preview.txt
      - name: Qualify IAM audit, least-privilege RLS and pooled transactions
        env:
          SG_TEST_PG_BINDIR: /usr/lib/postgresql/16/bin
        run: make preview-iam-db PYTHON=python

  frontend-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Focused login, MFA, account-recovery UI, and retired-reset proxy tests
        run: npm run test:preview

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [snapshot, history]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        run: |
          review_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$review_dir"
          cd "$review_dir"
          curl --fail --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$review_dir" >> "$GITHUB_PATH"
      - name: Scan candidate files or full available history; keep reports private
        run: python scripts/scan_public_secrets.py ${{ matrix.scope }}
