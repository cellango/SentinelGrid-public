[pytest]
# Pytest configuration for authentication tests
# NOTE: Run tests with conda environment activated: conda activate SentinelGrid

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    selenium: Selenium browser tests
    auth: Authentication tests
    slow: Slow running tests
    hero_flow_1: Hero flow 1 suites
    hero_flow_2: Hero flow 2 suites
    hero_flow_3: Hero flow 3 suites
    hero_flow_4: Hero flow 4 suites
    hero_flow_5: Hero flow 5 suites
    performance: Performance-focused suites
    security: Security-focused suites

# Asyncio configuration
asyncio_mode = auto

# Coverage (commented out - install pytest-cov to enable)
addopts =
    --verbose
    --strict-markers
    --tb=short
    -ra
    # --cov=backend.services.iam_agent
    # --cov-report=term-missing
    # --cov-report=html
    # --cov-report=xml

# Test timeout (for selenium tests)
timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
