# Flyway configuration for SOAR Agent
# Note: Environment variables in docker-compose take precedence
# This file is for local Flyway CLI usage

flyway.url=jdbc:postgresql://localhost:5432/sentinelgrid
flyway.user=sg
flyway.password=sg
flyway.schemas=public
flyway.locations=filesystem:db/migrations
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

