# Flyway configuration for schema-only migrations (skip data seeds)
#
# Usage example:
#   flyway -configFiles=backend/migrations/flyway-schema-only.conf \
#          -url=jdbc:postgresql://localhost:5432/sg \
#          -user=sg -password=sg \
#          -locations=filesystem:backend/migrations migrate
#
# Consolidated schema-only migrations live in backend/migrations_consolidated
flyway.locations=filesystem:backend/migrations_consolidated
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql
flyway.baselineOnMigrate=true
flyway.validateOnMigrate=true
