[pytest]
# Pytest configuration for Model Gateway tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow tests
    requires_gpu: Tests that require GPU
    requires_model: Tests that require actual model files

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -W ignore::DeprecationWarning

# Test paths
testpaths = tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

