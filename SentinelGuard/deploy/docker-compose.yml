services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    platform: linux/amd64
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "19200:9200" # avoid clashing with existing OpenSearch on 9200
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    platform: linux/amd64
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
    ports:
      - "15601:5601" # avoid clashing with existing Dashboards on 5601
    depends_on:
      opensearch:
        condition: service_healthy

  embedding-service:
    image: ghcr.io/mendhak/http-https-echo:31
    platform: linux/amd64
    environment:
      - HTTP_PORT=80
    ports:
      - "18081:80" # shifted to avoid host clashes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sentinelguard-server:
    build:
      context: ..
      dockerfile: Dockerfile.edr
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - EMBEDDING_URL=http://embedding-service:80
    ports:
      - "8085:8085"
    depends_on:
      opensearch:
        condition: service_healthy
      embedding-service:
        condition: service_started

  postgres:
    image: ankane/pgvector:latest
    platform: linux/amd64
    environment:
      - POSTGRES_USER=sentinel
      - POSTGRES_PASSWORD=sentinel
      - POSTGRES_DB=sentinel
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
